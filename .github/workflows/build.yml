name: RICEOS build

on:
  push:
  workflow_dispatch:

jobs:
  image:
    name: 리눅스 USB 이미지 (riceos.img)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: 수정된 zip 풀기
        run: |
          [ -f RICEOS_github_fixed.zip ] || { echo "RICEOS_github_fixed.zip 이 저장소 루트에 없습니다"; exit 1; }
          mkdir -p riceos
          unzip -oq RICEOS_github_fixed.zip -d riceos
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev zlib1g-dev \
            debootstrap parted dosfstools e2fsprogs util-linux xz-utils
      - name: riceos-ui 빌드 (이미지에 넣을 파일)
        working-directory: riceos/linux
        run: RICEOS_SYSTEM_LIBS=1 sh build.sh
      - name: chromium 을 chroot 설치 단계로 이동
        working-directory: riceos/linux
        run: |
          python3 - <<'PY'
          p = 'make_image.sh'
          s = open(p, encoding='utf-8').read()
          old_list = ',chromium \\\n'
          assert s.count(old_list) == 1, 'chromium 목록 줄을 찾지 못했습니다'
          s = s.replace(old_list, ' \\\n')
          old_bluez = 'apt-get install -y -qq bluez systemd-resolved\n'
          assert s.count(old_bluez) == 1, 'bluez 설치 줄을 찾지 못했습니다'
          s = s.replace(old_bluez, 'apt-get install -y -qq bluez systemd-resolved chromium\n')
          open(p, 'w', encoding='utf-8').write(s)
          print('CHROMIUM_MOVED_OK')
          PY
          bash -n make_image.sh
      - name: 부팅 화면 테마를 script 모듈로 교체 (two-step 없음)
        working-directory: riceos/linux/plymouth/riceos
        run: |
          cat > riceos.plymouth <<'PLY'
          [Plymouth Theme]
          Name=RICEOS
          Description=RICEOS 부팅 화면: 가운데 로고와 가로 로딩바
          ModuleName=script

          [script]
          ImageDir=/usr/share/plymouth/themes/riceos
          ScriptFile=/usr/share/plymouth/themes/riceos/riceos.script
          PLY
          cat > riceos.script <<'SCRIPT'
          screen_w = Window.GetWidth();
          screen_h = Window.GetHeight();

          Window.SetBackgroundTopColor(0, 0, 0);
          Window.SetBackgroundBottomColor(0, 0, 0);

          logo_img = Image.Text("RICEOS", 1, 1, 1);
          logo = Sprite(logo_img);
          logo.SetX(screen_w / 2 - logo_img.GetWidth() / 2);
          logo.SetY(screen_h * 0.40);
          logo.SetZ(0);

          box_img = Image("progress_box.png");
          box = Sprite(box_img);
          box_x = screen_w / 2 - box_img.GetWidth() / 2;
          box_y = screen_h * 0.72;
          box.SetX(box_x);
          box.SetY(box_y);
          box.SetZ(0);

          bar_full = Image("progress_bar.png");
          bar = Sprite();
          bar.SetZ(1);

          fun progress_callback(duration, progress) {
              w = bar_full.GetWidth() * progress;
              if (w < 1)
                  w = 1;
              bar.SetImage(bar_full.Scale(w, bar_full.GetHeight()));
              bar.SetX(box_x);
              bar.SetY(box_y);
          }
          Plymouth.SetBootProgressFunction(progress_callback);
          SCRIPT
          ls -l
      - name: riceos.img 만들기 (Debian 설치, 몇십 분 걸림)
        working-directory: riceos/linux
        run: sudo bash make_image.sh 5G
      - name: 압축 (용량 줄이기)
        working-directory: riceos/linux
        run: |
          xz -T0 -6 -c riceos.img > riceos.img.xz
          rm -f riceos.img
          ls -lh riceos.img.xz
      - uses: actions/upload-artifact@v4
        with:
          name: riceos.img.xz
          path: riceos/linux/riceos.img.xz
          retention-days: 14
      - name: 실패 로그 보기
        if: failure()
        run: sudo tail -n 200 /tmp/riceos-root.*/debootstrap/debootstrap.log || true
