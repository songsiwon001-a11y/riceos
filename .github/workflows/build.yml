name: RICEOS build

on:
  push:
  workflow_dispatch:

jobs:
  efi:
    name: UEFI 부트로더 (BOOTX64.EFI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: 수정된 zip 풀기
        run: |
          [ -f RICEOS_github_fixed.zip ] || { echo "RICEOS_github_fixed.zip 이 저장소 루트에 없습니다"; exit 1; }
          mkdir -p riceos
          unzip -oq RICEOS_github_fixed.zip -d riceos
          if [ -d "riceos/riceos" ]; then
            mv riceos/riceos/* riceos/
            rmdir riceos/riceos
          fi
      - name: 도구 설치 (MinGW 크로스 컴파일러)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: BOOTX64.EFI 빌드
        working-directory: riceos
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BOOTX64.EFI
          path: riceos/BOOTX64.EFI

  linux:
    name: 리눅스 UI (riceos-ui)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: 수정된 zip 풀기
        run: |
          [ -f RICEOS_github_fixed.zip ] || { echo "RICEOS_github_fixed.zip 이 저장소 루트에 없습니다"; exit 1; }
          mkdir -p riceos
          unzip -oq RICEOS_github_fixed.zip -d riceos
          if [ -d "riceos/riceos" ]; then
            mv riceos/riceos/* riceos/
            rmdir riceos/riceos
          fi
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev zlib1g-dev
      - name: riceos-ui 빌드
        working-directory: riceos/linux
        run: RICEOS_SYSTEM_LIBS=1 sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: riceos-ui
          path: riceos/linux/riceos-ui

  image:
    name: 리눅스 USB 이미지 (riceos.img)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: 수정된 zip 풀기
        run: |
          [ -f RICEOS_github_fixed.zip ] || { echo "RICEOS_github_fixed.zip 이 저장소 루트에 없습니다"; exit 1; }
          mkdir -p riceos
          unzip -oq RICEOS_github_fixed.zip -d riceos
          if [ -d "riceos/riceos" ]; then
            mv riceos/riceos/* riceos/
            rmdir riceos/riceos
          fi
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev zlib1g-dev \
            debootstrap parted dosfstools e2fsprogs util-linux xz-utils
      - name: riceos-ui 빌드 (이미지에 넣을 파일)
        working-directory: riceos/linux
        run: RICEOS_SYSTEM_LIBS=1 sh build.sh
      - name: make_image.sh 패치 (chroot 내 shim-signed 오류 방지)
        working-directory: riceos/linux
        run: |
          # debootstrap include 목록에서 shim-signed 제거
          sed -i 's/,shim-signed//g; s/shim-signed,//g; s/shim-signed//g' make_image.sh
          # 에러 발생 시 임시 폴더가 삭제되기 전에 debootstrap.log를 출력하도록 수정
          sed -i 's/cleanup()/cleanup() { sudo tail -n 100 \/tmp\/riceos-root.*\/debootstrap\/debootstrap.log 2>\/dev\/null || true;/g' make_image.sh
      - name: riceos.img 만들기 (Debian 설치, 몇십 분 걸림)
        working-directory: riceos/linux
        run: sudo bash make_image.sh 5G
      - name: 압축 (용량 줄이기)
        working-directory: riceos/linux
        run: |
          xz -T0 -6 -c riceos.img > riceos.img.xz
          rm -f riceos.img
          ls -lh riceos.img.xz
      - uses: actions/upload-artifact@v4
        with:
          name: riceos.img.xz
          path: riceos/linux/riceos.img.xz
          retention-days: 14
