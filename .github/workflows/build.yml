name: RICEOS build

on:
  push:
  workflow_dispatch:

jobs:
  image:
    name: 리눅스 USB 이미지 (riceos.img)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: 수정된 zip 풀기
        run: |
          [ -f RICEOS_github_fixed_v31.zip ] || { echo "RICEOS_github_fixed_v31.zip 이 저장소 루트에 없습니다"; exit 1; }
          mkdir -p riceos
          unzip -oq RICEOS_github_fixed_v31.zip -d riceos
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap parted dosfstools e2fsprogs util-linux \
            xz-utils squashfs-tools
      - name: riceos.img 만들기 (Debian 설치, 몇십 분 걸림)
        working-directory: riceos/linux
        run: sudo bash make_image.sh 10G
      - name: 압축 (용량 줄이기)
        working-directory: riceos/linux
        run: |
          xz -T0 -6 -c riceos.img > riceos.img.xz
          rm -f riceos.img
          ls -lh riceos.img.xz
      - uses: actions/upload-artifact@v4
        with:
          name: riceos.img.xz
          path: riceos/linux/riceos.img.xz
          retention-days: 14
      - name: 실패 로그 보기
        if: failure()
        run: sudo tail -n 200 /tmp/riceos-root.*/debootstrap/debootstrap.log || true
