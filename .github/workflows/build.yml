name: RICEOS build

on:
  push:
  workflow_dispatch:

jobs:
  efi:
    name: UEFI 부트로더 (BOOTX64.EFI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: zip 풀기
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q "$ZIP" -d src
          if [ ! -f src/build.sh ] && [ -f src/riceos/build.sh ]; then cp -r src/riceos/. src/; fi
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: BOOTX64.EFI 빌드
        working-directory: src
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BOOTX64.EFI
          path: src/BOOTX64.EFI

  linux:
    name: 리눅스 UI (riceos-ui)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: zip 풀기
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q "$ZIP" -d src
          if [ ! -f src/build.sh ] && [ -f src/riceos/build.sh ]; then cp -r src/riceos/. src/; fi
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev zlib1g-dev
      - name: riceos-ui 빌드
        working-directory: src/linux
        run: RICEOS_SYSTEM_LIBS=1 sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: riceos-ui
          path: src/linux/riceos-ui

  image:
    name: 리눅스 USB 이미지 (riceos.img)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: zip 풀기
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q "$ZIP" -d src
          if [ ! -f src/build.sh ] && [ -f src/riceos/build.sh ]; then cp -r src/riceos/. src/; fi
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev zlib1g-dev \
            debootstrap parted dosfstools e2fsprogs util-linux xz-utils
      - name: riceos-ui 빌드 (이미지에 넣을 파일)
        working-directory: src/linux
        run: RICEOS_SYSTEM_LIBS=1 sh build.sh
      - name: riceos.img 만들기 (Debian 설치, 몇십 분 걸림)
        working-directory: src/linux
        run: sudo bash make_image.sh 5G
      - name: 압축 (용량 줄이기)
        working-directory: src/linux
        run: |
          sudo chown $USER riceos.img
          xz -T0 -6 riceos.img
          ls -lh riceos.img.xz
      - uses: actions/upload-artifact@v4
        with:
          name: riceos.img.xz
          path: src/linux/riceos.img.xz
          retention-days: 14
